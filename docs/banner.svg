    <rect x="44"  y="192" width="96" height="30" rx="15" fill="#1f2a44" stroke="#2f3b5c"/><text x="92"  y="212" text-anchor="middle" fill="#cbd5e6">Recon</text>
    <rect x="150" y="192" width="104" height="30" rx="15" fill="#1f2a44" stroke="#2f3b5c"/><text x="202" y="212" text-anchor="middle" fill="#cbd5e6">Scanning</text>
    <rect x="264" y="192" width="128" height="30" rx="15" fill="#1f2a44" stroke="#2f3b5c"/><text x="328" y="212" text-anchor="middle" fill="#cbd5e6">Exploitation</text>
    <rect x="402" y="192" width="84"  height="30" rx="15" fill="#1f2a44" stroke="#2f3b5c"/><text x="444" y="212" text-anchor="middle" fill="#cbd5e6">Web</text>
    <rect x="496" y="192" width="104" height="30" rx="15" fill="#1f2a44" stroke="#2f3b5c"/><text x="548" y="212" text-anchor="middle" fill="#cbd5e6">Wireless</text>
    <rect x="610" y="192" width="84"  height="30" rx="15" fill="#1f2a44" stroke="#2f3b5c"/><text x="652" y="212" text-anchor="middle" fill="#cbd5e6">Cloud</text>
