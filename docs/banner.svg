      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="250" rx="10" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="250" fill="#39d353"/>

  <text x="44" y="78" font-size="15" fill="#39d353" font-family="Consolas, monospace">$ ./learn --ethical-hacking --hands-on</text>
